<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0916">
  <title>Committee – Herman 30</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Unbounded:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dev-sticker.css">
  <link rel="stylesheet" href="committee.css">
</head>
<body>
  <main class="committee-page">
    <a class="back-link" href="index.html#committees">All committees</a>
    <header class="committee-hero">
      <span class="committee-icon" aria-hidden="true"></span>
      <h1>Committee</h1>
      <p id="committee-description">Choose a committee from the Crew tab.</p>
      <div class="row hero-actions">
        <button type="button" id="admin-button" class="admin-toggle" hidden>🔒 Admin</button>
        <button type="button" id="edit-description" class="admin-toggle" hidden>✏️ Edit description</button>
      </div>
    </header>

    <section id="roster" hidden aria-labelledby="roster-title">
      <h2 id="roster-title">Members</h2>
      <p id="roster-empty">The roster is coming soon.</p>
      <ul id="members" class="member-grid" hidden></ul>
    </section>

    <section id="planner" hidden aria-labelledby="planner-title">
      <h2 id="planner-title">🗓️ Activity planner</h2>
      <p class="planner-sub">Only visible to this committee's admins. Drag notes between days, or use ◀ ▶.</p>
      <form id="planner-form" class="planner-form">
        <input name="title" maxlength="120" required placeholder="What needs doing? e.g. Buy bread for lunch">
        <textarea name="details" maxlength="1000" rows="2" placeholder="Details (optional)"></textarea>
        <div class="row">
          <label>Day<select name="day"></select></label>
          <label>Time<input name="time" type="time"></label>
          <label>Who<select name="who"></select></label>
        </div>
        <div class="row">
          <div class="swatches" role="radiogroup" aria-label="Colour"></div>
          <button class="admin-btn primary">Add to planner</button>
          <button type="button" class="admin-btn" data-act="cancel-edit" hidden>Cancel</button>
        </div>
      </form>
      <div id="planner-board" class="planner-board"></div>
    </section>

    <dialog id="pin-dialog" class="pin-dialog">
      <form id="pin-form" class="pin-box">
        <h2 id="pin-title">Admin</h2>
        <p>Enter the committee's 4-digit PIN.</p>
        <input id="pin-input" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]*" aria-label="PIN">
        <p id="pin-error" class="pin-error" role="alert"></p>
        <div class="row"><button class="admin-btn primary">Unlock</button><button type="button" class="admin-btn" id="pin-cancel">Cancel</button></div>
      </form>
    </dialog>

    <template id="development-art">
      <div class="reactor">
        <div class="dev-art" aria-hidden="true">
          <span class="dev-starfield"></span>
          <span class="reactor-ring"></span>
          <span class="dev-orbit"></span>
          <span class="dev-orbit"></span>
          <span class="dev-sword dev-sword-cyan"></span>
          <span class="dev-sword dev-sword-magenta"></span>
          <span class="dev-core">&lt;/&gt;</span>
          <canvas class="dev-bursts"></canvas>
        </div>
        <div class="reactor-controls">
          <button class="dev-trigger" type="button" hidden>⚡ Overclock</button>
          <button class="dev-trigger chain-trigger" type="button" hidden>Chain reaction</button>
          <button class="dev-trigger singularity-trigger" type="button" hidden>Open singularity</button>
        </div>
      </div>
    </template>

    <template id="member-card">
      <li class="member-card">
        <img loading="lazy" alt="">
        <div class="member-text">
          <h3></h3>
          <p><strong>Fun fact</strong> <span></span></p>
        </div>
      </li>
    </template>
  </main>
  <script type="module" src="committee.js"></script>
</body>
</html>
